<mat-card>
  <mat-card-header>
    <span class="spacer"></span>
    <button matButton="filled" (click)="addInvoice()"><mat-icon>add</mat-icon>Add Invoice</button>
  </mat-card-header>

  <mat-divider></mat-divider>

  <mat-card-content>
    <div class="table-container">
      <table mat-table [dataSource]="invoiceList" matSort>
        <ng-container matColumnDef="invoiceNumber">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Invoice #</th>
          <td mat-cell *matCellDef="let element">{{ element.invoiceNumber }}</td>
        </ng-container>

        <ng-container matColumnDef="customerName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Customer</th>
          <td mat-cell *matCellDef="let element">{{ element.customerName }}</td>
        </ng-container>

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Date</th>
          <td mat-cell *matCellDef="let element">{{ element.date }}</td>
        </ng-container>

        <ng-container matColumnDef="amount">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Amount</th>
          <td mat-cell *matCellDef="let element">{{ element.amount }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="invoiceCols"></tr>
        <tr mat-row *matRowDef="let row; columns: invoiceCols"></tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
