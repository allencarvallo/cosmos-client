<mat-card>
  <mat-card-header>
    <span class="header-title">Invoice List</span>
    <span class="spacer"></span>
    <button mat-button="filled" (click)="addInvoice()"><mat-icon>add</mat-icon>Add Invoice</button>
  </mat-card-header>

  <mat-divider></mat-divider>

  <mat-card-content>
    @if (loading()) {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }

    <div class="table-container">
      <table mat-table [dataSource]="invoiceList" matSort>
        <ng-container matColumnDef="invoiceNumber">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Invoice #</th>
          <td mat-cell *matCellDef="let element">{{ element.invoiceNumber }}</td>
        </ng-container>

        <ng-container matColumnDef="customerName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Customer</th>
          <td mat-cell *matCellDef="let element">{{ element.customerName }}</td>
        </ng-container>

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Date</th>
          <td mat-cell *matCellDef="let element">{{ element.invoiceDate }}</td>
        </ng-container>

        <ng-container matColumnDef="amount">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Amount</th>
          <td mat-cell *matCellDef="let element">{{ element.invoiceAmount }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let element" class="actions-cell">
            <button mat-icon-button (click)="editInvoice(element)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="primary" (click)="downloadInvoice(element.invoiceId)">
              <mat-icon>download</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteInvoice(element.invoiceId)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="invoiceCols; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: invoiceCols" class="table-row"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell no-data" [colSpan]="invoiceCols.length">No invoices found.</td>
        </tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
